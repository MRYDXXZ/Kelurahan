<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Warga Kelurahan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #1a3a52;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            font-weight: 700;
        }

        h2 {
            color: #1a3a52;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5em;
            font-weight: 600;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #2c5aa0;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #1a3a52;
        }

        input, textarea {
            padding: 10px;
            border: 1px solid #d0d8e0;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fafbfc;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2c5aa0;
            box-shadow: 0 0 0 3px rgba(44, 90, 160, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            grid-column: 1 / -1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #2c5aa0 0%, #1a3a52 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(44, 90, 160, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .warga-list-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .warga-card {
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #f9f9f9;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .warga-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background: white;
        }

        .warga-card h3 {
            color: #2c5aa0;
            margin-bottom: 10px;
            font-size: 1.3em;
            font-weight: 600;
        }

        .warga-card p {
            color: #555;
            margin: 5px 0;
            line-height: 1.6;
        }

        .warga-card strong {
            color: #333;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1em;
        }

        .loading span {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-bottom: 3px solid #2c5aa0;
        }

        .navbar-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #1a3a52;
        }

        .navbar-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .navbar-buttons a, .navbar-buttons button {
            padding: 10px 15px;
            background: #2c5aa0;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-size: 0.95em;
        }

        .navbar-buttons a:hover, .navbar-buttons button:hover {
            background: #1a3a52;
            transform: translateY(-2px);
        }

        .navbar-buttons a.active {
            background: #d4af37;
            color: #1a3a52;
        }

        .auth-status {
            color: #1a3a52;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-indicator.logged-in {
            background: #44ff44;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <div class="navbar">
            <div class="navbar-title">📋 Kelurahan Warga</div>
            <div class="navbar-buttons">
                <a href="index.html" class="active">🏠 Warga</a>
                <a href="pengaduan.html">📢 Pengaduan</a>
                <button id="auth-btn">🔐 Login</button>
            </div>
            <div class="auth-status">
                <span id="auth-text">Belum Login</span>
                <div id="status-dot" class="status-indicator"></div>
            </div>
        </div>

        <h1>📋 Daftar Warga Kelurahan</h1>

        <!-- Form Section -->
        <div class="form-container">
            <h2>Tambah Warga Baru</h2>
            <div id="form-message"></div>
            <form id="warga-form">
                <div class="form-group">
                    <label for="nik">NIK:</label>
                    <input type="text" id="nik" name="nik" required>
                </div>
                <div class="form-group">
                    <label for="nama_lengkap">Nama Lengkap:</label>
                    <input type="text" id="nama_lengkap" name="nama_lengkap" required>
                </div>
                <div class="form-group">
                    <label for="no_telepon">No. Telepon:</label>
                    <input type="tel" id="no_telepon" name="no_telepon" required>
                </div>
                <div class="form-group full">
                    <label for="alamat">Alamat:</label>
                    <textarea id="alamat" name="alamat" required></textarea>
                </div>
                <button type="submit">Daftar Warga</button>
            </form>
        </div>

        <!-- List Section -->
        <div class="warga-list-container">
            <h2>Data Warga</h2>
            <div id="warga-list-container">
                <div class="loading">
                    <span>⏳</span> Memuat data...
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
